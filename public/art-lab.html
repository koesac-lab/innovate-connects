<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<meta name="robots" content="noindex"/>
<title>Innovate Connects — Art Lab</title>
<style>
  :root { color-scheme: dark; }
  body { margin:0; background:#070d13; color:#d7e2ea; font:15px/1.5 system-ui,sans-serif; padding:24px; }
  h1 { font-size:18px; letter-spacing:.12em; text-transform:uppercase; font-weight:600; }
  p.hint { color:#7d8fa0; max-width:70ch; }
  code { background:#101c26; padding:2px 6px; border-radius:4px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(340px,1fr)); gap:20px; margin-top:20px; }
  figure { margin:0; }
  figure a { display:block; border:1px solid #1c2c3a; border-radius:8px; overflow:hidden; }
  img { display:block; width:100%; height:auto; background:#0A141C; }
  figcaption { padding:6px 2px; color:#7d8fa0; font-size:13px; display:flex; justify-content:space-between; }
</style>
</head>
<body>
<h1>Art Lab — hero flow variants</h1>
<p class="hint">Seed variants of the layered hero texture. Pick the seeds you like, then lock them into
<code>tools/generate-flow.mjs</code> (<code>SEEDS.hero</code>) and re-run <code>node tools/generate-flow.mjs --only hero</code>.
Regenerate this set with <code>node tools/generate-flow.mjs --lab 1 9</code>.</p>
<div class="grid" id="grid"></div>
<script>
  const grid = document.getElementById("grid");
  for (let i = 1; i <= 9; i++) {
    const seed = 1000 + i * 97;
    const fig = document.createElement("figure");
    fig.innerHTML = `<a href="art-lab/variant-${i}.svg" target="_blank" rel="noopener">
      <img src="art-lab/variant-${i}.svg" alt="variant ${i}" loading="lazy"/></a>
      <figcaption><span>variant ${i}</span><span>seed ${seed}</span></figcaption>`;
    grid.appendChild(fig);
  }
</script>
</body>
</html>
