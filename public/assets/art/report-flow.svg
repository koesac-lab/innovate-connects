<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="title desc" role="img" viewBox="0 0 1600 1000">
  <title id="title">Report cover flow artwork</title>
  <desc id="desc">Decorative deep teal, burgundy and gold connectivity artwork for reports and insight cards.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#071618"/>
      <stop offset=".55" stop-color="#08282b"/>
      <stop offset="1" stop-color="#120f15"/>
    </linearGradient>
    <radialGradient cx="80%" cy="20%" id="teal" r="72%">
      <stop offset="0" stop-color="#077980" stop-opacity=".7"/>
      <stop offset=".44" stop-color="#075d63" stop-opacity=".28"/>
      <stop offset="1" stop-color="#081719" stop-opacity="0"/>
    </radialGradient>
    <radialGradient cx="68%" cy="88%" id="wine" r="66%">
      <stop offset="0" stop-color="#861d42" stop-opacity=".74"/>
      <stop offset=".42" stop-color="#55142e" stop-opacity=".45"/>
      <stop offset="1" stop-color="#180d16" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" x2="1" y1="1" y2="0">
      <stop offset="0" stop-color="#9c6429" stop-opacity="0"/>
      <stop offset=".2" stop-color="#d99e42"/>
      <stop offset=".49" stop-color="#fff0b9"/>
      <stop offset=".74" stop-color="#cd8d35"/>
      <stop offset="1" stop-color="#9c6429" stop-opacity="0"/>
    </linearGradient>
    <filter height="160%" id="glow" width="160%" x="-30%" y="-30%">
      <feGaussianBlur result="b" stdDeviation="2.2"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="grain">
      <feTurbulence baseFrequency=".78" numOctaves="4" seed="31" stitchTiles="stitch" type="fractalNoise"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA tableValues="0 .42" type="table"/>
      </feComponentTransfer>
    </filter>
  </defs>
  <rect fill="url(#bg)" height="1000" width="1600"/>
  <rect fill="url(#teal)" height="1000" width="1600"/>
  <rect fill="url(#wine)" height="1000" width="1600"/>
  <g fill="none" stroke-linecap="round">
    <path d="M734 1120 C741 838 978 853 1037 631 C1103 385 931 243 1169 60 C1309 -48 1469 -50 1753 -115" opacity=".84" stroke="#063d43" stroke-width="188"/>
