    <path d="M598 1126 C680 861 906 847 993 633 C1090 393 901 194 1138 25 C1315 -102 1479 -71 1733 -131" opacity=".65" stroke="#5a1731" stroke-width="101"/>
    <path d="M598 1126 C680 861 906 847 993 633 C1090 393 901 194 1138 25 C1315 -102 1479 -71 1733 -131" opacity=".45" stroke="#922344" stroke-width="51"/>
    <path d="M634 1110 C711 858 926 844 1008 637 C1104 403 920 209 1150 38 C1322 -90 1495 -62 1747 -123" filter="url(#glow)" stroke="url(#gold)" stroke-width="5"/>
    <path d="M660 1106 C735 852 940 838 1020 642 C1115 414 938 222 1162 51 C1330 -77 1510 -55 1750 -115" opacity=".86" stroke="#f1c970" stroke-width="1.3"/>
    <path d="M687 1102 C758 847 957 834 1034 648 C1128 426 955 236 1174 65 C1340 -66 1521 -48 1754 -108" opacity=".8" stroke="#d99c40" stroke-width=".72"/>
    <path d="M852 1080 C875 813 1080 824 1133 600 C1192 350 1045 233 1263 83 C1410 -17 1542 -8 1741 -49" opacity=".82" stroke="url(#gold)" stroke-width="2.6"/>
    <path d="M889 1065 C912 810 1095 810 1145 597 C1205 365 1062 250 1276 94 C1418 -8 1554 0 1738 -42" opacity=".74" stroke="#f4d98f" stroke-width=".8"/>
  </g>
  <g fill="none" opacity=".68" stroke="#e8be67" stroke-linecap="round">
    <path d="M1008 637 C940 580 887 543 825 528"/>
    <path d="M825 528 C775 491 734 449 686 393"/>
    <path d="M825 528 C766 552 713 593 670 645"/>
    <path d="M686 393 C653 354 612 337 559 335"/>
  </g>
  <g fill="#f5d37c" filter="url(#glow)">
    <circle cx="1008" cy="637" r="8"/>
    <circle cx="825" cy="528" r="6.3"/>
    <circle cx="686" cy="393" r="4.8"/>
    <circle cx="670" cy="645" r="4.5"/>
    <circle cx="559" cy="335" r="3.8"/>
  </g>
  <rect filter="url(#grain)" height="1000" opacity=".1" style="mix-blend-mode:soft-light" width="1600"/>
