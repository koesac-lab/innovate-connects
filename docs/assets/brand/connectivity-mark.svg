<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 150" role="img" aria-labelledby="title desc"><title id="title">Innovate Connects network mark</title><desc id="desc">A gold connectivity mark made from linked nodes and flowing arcs.</desc><defs><linearGradient id="gold" x1="20" y1="132" x2="146" y2="16" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#b8782c"/><stop offset=".42" stop-color="#f2cc79"/><stop offset=".74" stop-color="#ffe9aa"/><stop offset="1" stop-color="#c58c38"/></linearGradient><filter id="glow" x="-35%" y="-35%" width="170%" height="170%"><feGaussianBlur stdDeviation="2.4" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><g fill="none" stroke="url(#gold)" stroke-linecap="round" filter="url(#glow)"><path d="M31 123 C53 80 87 53 132 30" stroke-width="5.5"/><path d="M42 130 C59 91 87 70 133 55" stroke-width="4.5"/><path d="M53 134 C67 104 91 91 131 82" stroke-width="3.5"/></g><g fill="url(#gold)"><circle cx="30" cy="124" r="14"/><circle cx="133" cy="29" r="11"/><circle cx="134" cy="55" r="10"/><circle cx="132" cy="82" r="9"/></g><g fill="#fff0bf" opacity=".9"><circle cx="26.5" cy="119.5" r="3.2"/><circle cx="130" cy="25.5" r="2.5"/><circle cx="131" cy="51.5" r="2.3"/><circle cx="129.5" cy="79" r="2.1"/></g></svg>