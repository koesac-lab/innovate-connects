name: Publish Innovate Connects directory
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'public/**'
      - '.github/workflows/publish-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Assemble site
        run: |
          set -eu
          mkdir -p _site/concept-two
          cp -a docs/. _site/
          mv _site/index.html _site/showcase.html
          cp -a public/. _site/concept-two/
          cp docs/links.html _site/index.html
          rm _site/links.html
          touch _site/.nojekyll
          test -s _site/index.html
          test -s _site/showcase.html
          test -s _site/concept-two/index.html
          test -s _site/concept-two/brand-direction.html
          test -s _site/concept-two/logo-ideas.html
          test -s _site/concept-two/art-lab.html
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
