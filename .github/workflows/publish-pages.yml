name: Validate showcase directory

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'public/**'
      - 'tools/build_pages.py'
      - '.github/workflows/publish-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble and check local assets and links
        run: python3 tools/build_pages.py
