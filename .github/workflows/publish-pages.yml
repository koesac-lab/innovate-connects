name: Validate showcase directory

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'public/**'
      - '.github/workflows/publish-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check linked pages
        run: |
          set -eu
          test -s docs/index.html
          test -s docs/links.html
          test -s public/index.html
          test -s public/brand-direction.html
          test -s public/logo-ideas.html
          test -s public/art-lab.html
