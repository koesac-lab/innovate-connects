name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble and validate site
        run: python3 tools/build_pages.py

      - name: Verify Concept 3 perspective deep link
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path

          class PerspectiveTarget(HTMLParser):
              count = 0

              def handle_starttag(self, tag, attrs):
                  if ('id', 'perspective') in attrs:
                      self.count += 1

          page = Path('_site/concept-two/concept-three/index.html')
          if not page.is_file():
              raise SystemExit(f'Missing published page: {page}')
          parser = PerspectiveTarget()
          parser.feed(page.read_text(encoding='utf-8'))
          parser.close()
          if parser.count != 1:
              raise SystemExit(f'{page}: expected exactly one #perspective target, found {parser.count}')
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

      - name: Deploy site
        uses: actions/deploy-pages@v4
        id: deployment
